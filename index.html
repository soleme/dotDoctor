<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도트 닥터</title>
<style>
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

/* Layout: 픽셀 진료실 무대를 야간 모니터 프레임에 담고, 종이 진료 차트를 오른쪽에 붙인다 (폰에서는 아래로) */
:root{
  color-scheme:dark;
  --night:#1e1a2c; --night-2:#2a2540; --night-3:#3b3458;
  --ink:#2b1d2e; --paper:#f4f7f3; --paper-2:#dce8e1; --rule:#c9dccf;
  --mint:#7fd1b9; --mint-hi:#c6f2e3; --mint-lo:#3f9e86;
  --coral:#ff6b5e; --coral-lo:#c4453b; --gold:#ffc94a; --gold-lo:#cf9420;
  --moon:#efeaf8; --dim:#a8a1c4; --muted:#5f6b66;
  --font:"Galmuri11","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --fs-s:12px; --fs-m:15px; --fs-l:18px; --fs-xl:24px;
  --edge:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(var(--night-2) 1px,transparent 1px);background-size:12px 12px;color:var(--moon);font-family:var(--font);font-size:var(--fs-m);line-height:1.5}
.pix{image-rendering:crisp-edges;image-rendering:pixelated}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}

/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-l);margin-right:auto;letter-spacing:.04em}
.brand img{width:27px;height:27px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--night-2);padding:3px 10px;margin:3px;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--night-3),0 3px 0 0 var(--night-3),-3px 0 0 0 var(--night-3),3px 0 0 0 var(--night-3)}
.chip img{width:18px;height:18px}
.chip.late{color:var(--coral)}
#hud-rep{gap:2px}
[data-phase="title"] .stat{display:none}

/* 버튼 */
.btn{font:inherit;font-size:var(--fs-m);color:var(--ink);background:var(--paper);border:0;padding:9px 14px;margin:3px;cursor:pointer;line-height:1.3;
  box-shadow:var(--edge),inset -3px -3px 0 0 var(--paper-2),inset 3px 3px 0 0 #fff}
.btn:hover{background:#fff}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.tool:focus-visible,.dx:focus-visible{outline:3px dashed var(--gold);outline-offset:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-go{background:var(--mint);box-shadow:var(--edge),inset -3px -3px 0 0 var(--mint-lo),inset 3px 3px 0 0 var(--mint-hi)}
.btn-go:hover{background:#95dcc7}
.btn-sm{font-size:var(--fs-s);padding:5px 10px}
.btn-warn{background:var(--coral);color:#fff;box-shadow:var(--edge),inset -3px -3px 0 0 var(--coral-lo),inset 3px 3px 0 0 #ffa49b}

/* 무대 */
#main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1000px){#main{grid-template-columns:minmax(0,1fr) 380px}}
#stage-wrap{min-width:0;display:flex;justify-content:center}
#stage{--s:1;position:relative;width:320px;height:180px;margin:8px;background:#000;
  box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--night-3),10px 10px 0 8px rgba(0,0,0,.35)}
#scene{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:manipulation;cursor:default}
#stage.mg #scene{cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.bubble{position:absolute;transform:translate(-50%,calc(-100% - 12px));width:max-content;max-width:48%;background:#fff;color:var(--ink);
  font-size:clamp(11px,calc(var(--s) * 5px),16px);line-height:1.45;padding:.4em .7em;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);animation:pop .16s steps(3)}
.bubble::before,.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  clip-path:polygon(0 0,100% 0,100% 34%,83% 34%,83% 67%,67% 67%,67% 100%,33% 100%,33% 67%,17% 67%,17% 34%,0 34%)}
.bubble::before{width:18px;height:12px;background:var(--ink)}
.bubble::after{width:12px;height:8px;background:#fff;margin-top:-1px}
.bubble.doc{background:var(--mint-hi)}
.bubble.doc::after{background:var(--mint-hi)}
@keyframes pop{from{transform:translate(-50%,calc(-100% - 6px)) scale(.8)}}

.fx{position:absolute;transform:translate(-50%,-100%);font-weight:700;white-space:nowrap;color:var(--gold);
  font-size:clamp(11px,calc(var(--s) * 5px),18px);
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  animation:rise 1.5s steps(15) forwards}
.fx.good{color:var(--mint)}
.fx.bad{color:var(--coral)}
.fx.info{color:#fff}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-70%)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-280%)}}

#banner{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);max-width:92%;width:max-content;text-align:center;background:var(--ink);color:var(--moon);
  font-size:clamp(10px,calc(var(--s) * 4.4px),16px);padding:.3em .9em}
#cap{position:absolute;left:12.5%;right:12.5%;bottom:2%;display:flex;align-items:center;gap:.6em;background:var(--paper);color:var(--ink);
  font-size:clamp(10px,calc(var(--s) * 4.4px),16px);padding:.35em .35em .35em .7em;pointer-events:auto;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
#cap-text{flex:1;min-width:0}
#cap .btn{font-size:inherit;padding:.25em .8em;flex:none}

#slip{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(70%,380px);background:#fffef8;color:var(--ink);pointer-events:auto;
  font-size:clamp(10px,calc(var(--s) * 4.2px),15px);padding:.7em 1em .8em;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),6px 6px 0 0 rgba(0,0,0,.35)}
#slip h3{margin:0 0 .4em;text-align:center;letter-spacing:.6em;font-size:1.3em;border-bottom:2px solid var(--ink);padding-bottom:.2em}
#slip dl{display:grid;grid-template-columns:auto 1fr;gap:.15em .9em;margin:0}
#slip dt{color:var(--muted)}
#slip dd{margin:0}
#slip .row{display:flex;justify-content:space-between;align-items:flex-end;gap:.6em;margin-top:.6em}
#slip .btn{font-size:inherit;padding:.3em .9em}
.seal{width:3.2em;height:3.2em;flex:none;display:grid;place-items:center;border:3px solid var(--coral);color:var(--coral);font-weight:700;line-height:1.1;text-align:center;
  transform:rotate(-12deg) scale(0);transition:transform .18s steps(3)}
.seal.on{transform:rotate(-12deg) scale(1)}

#title-ui{position:absolute;left:0;right:0;top:5%;display:flex;flex-direction:column;align-items:center;gap:.3em}
.logo{font-weight:700;font-size:clamp(28px,calc(var(--s) * 15px),60px);line-height:1.1;color:#fff;letter-spacing:.08em;
  text-shadow:.06em .06em 0 var(--ink),.12em .12em 0 var(--coral),.18em .18em 0 var(--ink)}
.logo-sub{font-size:clamp(10px,calc(var(--s) * 4px),15px);color:var(--ink);background:var(--gold);padding:.1em .7em;letter-spacing:.08em}

/* 패널 */
#panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--paper);color:var(--ink);padding:14px 16px;margin:3px;min-width:0;box-shadow:var(--edge),8px 8px 0 0 rgba(0,0,0,.3)}
.chart-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:-14px -16px 12px;padding:7px 16px;
  background:var(--mint);border-bottom:3px solid var(--ink)}
.chart-top b{font-size:var(--fs-m)}
.chart-top small{font-size:var(--fs-s);color:#1f4a40}
.chart-top.coral{background:#ffb3aa}
.lead{margin:0;font-size:var(--fs-l)}
.meta{margin:4px 0 0;font-size:var(--fs-s);color:var(--muted)}
.idrow{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.idrow .nm{font-size:var(--fs-l);font-weight:700}
.cc{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.tag{flex:none;font-size:var(--fs-s);background:var(--ink);color:var(--paper);padding:0 5px;margin-top:2px}
.finds{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--ink)}
.finds li{display:grid;grid-template-columns:24px 4.2em minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--rule)}
.finds li.empty{display:block;color:var(--muted);font-size:var(--fs-s)}
.finds img{width:24px;height:24px}
.finds .fl{font-size:var(--fs-s);color:var(--muted);padding-top:2px}
.flag{color:var(--coral-lo);white-space:nowrap}
.qlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qlist small{color:var(--muted)}
.pbar{width:90px;height:9px;background:var(--ink);padding:2px;flex:none}
.pbar i{display:block;height:100%;background:#58c76a}
.pbar i.mid{background:var(--gold)}
.pbar i.low{background:var(--coral)}

.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:3px}
.tool{font:inherit;color:var(--ink);background:var(--paper);border:0;margin:3px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;
  box-shadow:var(--edge),inset -3px -3px 0 0 var(--paper-2),inset 3px 3px 0 0 #fff}
.tool:hover:not([disabled]){background:#fff}
.tool:active:not([disabled]){transform:translateY(2px)}
.tool img{width:24px;height:24px}
.tool .tn{font-size:var(--fs-s);white-space:nowrap}
.tool .tc{font-size:var(--fs-s);color:#736b8c;font-variant-numeric:tabular-nums}
.tool.used{background:var(--mint-hi)}
.tool.used .tc{color:var(--mint-lo)}
.tool[disabled]{opacity:.42;cursor:not-allowed}
.tool.locked{background:var(--night-3);color:var(--dim);box-shadow:var(--edge)}
.tool.locked .tc{color:var(--dim)}

.dx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dx{font:inherit;text-align:left;color:var(--ink);background:#fff;border:0;margin:2px;padding:6px 9px;cursor:pointer;min-width:0;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.dx:hover{background:var(--mint-hi)}
.dx b{display:block;font-weight:400}
.dx small{display:block;font-size:var(--fs-s);color:var(--muted)}
.dx.sel{background:var(--gold)}
.dx.sel small{color:var(--ink)}

.actions{display:flex;flex-wrap:wrap;gap:6px;padding:3px}
.actions .btn{flex:1 1 auto}
.actions.col{flex-direction:column}

.result .stamp{display:inline-block;font-size:var(--fs-xl);font-weight:700;color:var(--mint-lo);border:3px solid currentColor;padding:0 10px;transform:rotate(-3deg);margin:2px 0 6px}
.result.bad .stamp{color:var(--coral-lo)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:8px 0 0}
.kv dt{color:var(--muted);font-size:var(--fs-s);padding-top:2px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.plus{color:var(--mint-lo)} .minus{color:var(--coral-lo)}
.lesson{margin:12px 0 0;padding:8px 10px;background:#ffe7e3;font-size:var(--fs-s)}
.lesson b{display:block;font-size:var(--fs-m)}
.foot{margin:2px 6px;font-size:var(--fs-s);color:var(--dim)}
.title-card h2{margin:0 0 6px;font-size:var(--fs-l);text-wrap:balance}
.title-card p{margin:0}

/* 모달 */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,14,28,.8)}
.mcard{width:min(100%,600px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);color:var(--ink);padding:18px 20px;margin:3px;
  box-shadow:var(--edge),10px 10px 0 0 rgba(0,0,0,.4)}
.mcard.wide{width:min(100%,820px)}
.eyebrow{display:inline-block;font-size:var(--fs-s);letter-spacing:.14em;background:var(--ink);color:var(--gold);padding:1px 8px}
.mcard h2{margin:6px 0 4px;font-size:var(--fs-xl);line-height:1.25;text-wrap:balance}
.mcard h3{margin:16px 0 6px;font-size:var(--fs-m);border-bottom:2px solid var(--ink);padding-bottom:2px}
.mcard p{margin:6px 0}
.steps{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.newlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.newlist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.newlist img{width:24px;height:24px;margin-top:2px}
.newlist b{display:block}
.newlist span{font-size:var(--fs-s);color:var(--muted)}
.dzbullet{width:24px;height:24px;display:grid;place-items:center;background:var(--coral);color:#fff;font-size:var(--fs-s);margin-top:2px}
.mcard .actions{margin-top:14px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.stat-cell{background:#fff;padding:8px 10px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px}
.stat-cell small{display:block;font-size:var(--fs-s);color:var(--muted)}
.stat-cell b{font-size:var(--fs-l);font-variant-numeric:tabular-nums}
@media (max-width:480px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.remark{background:var(--mint-hi);padding:8px 10px;margin-top:12px!important}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.item{background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:4px;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.item p{margin:0;font-size:var(--fs-s);color:var(--muted);flex:1}
.item .price{font-variant-numeric:tabular-nums}
.item .btn{align-self:flex-start;font-size:var(--fs-s);padding:5px 12px}
.item.owned{background:var(--mint-hi)}
.grade{display:flex;align-items:center;gap:16px;margin-top:8px}
.grade .big{font-size:60px;line-height:1;font-weight:700;color:var(--coral);text-shadow:4px 4px 0 var(--ink)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dzcard{background:#fff;padding:9px 11px;margin:2px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.dzcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dzcard p{margin:0;font-size:var(--fs-s)}
.dzcard footer{font-size:var(--fs-s);color:var(--muted)}
.dzcard.locked{background:var(--paper-2);color:var(--muted)}
.badge{font-size:var(--fs-s);background:var(--ink);color:var(--paper);padding:0 6px;white-space:nowrap}
.toolref{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.toolref li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;font-size:var(--fs-s)}
.toolref img{width:24px;height:24px}
.toolref b{font-size:var(--fs-m);font-weight:400}
.toolref .off{opacity:.5}

@media (max-width:520px){
  #hud{gap:4px}
  .brand{font-size:var(--fs-m)} .brand img{width:18px;height:18px}
  .chip{font-size:var(--fs-s);padding:1px 6px} .chip img,#hud-rep img{width:13px;height:13px}
  #hud .btn-sm{padding:3px 7px}
}
@media (prefers-reduced-motion:reduce){
  .bubble{animation:none}
  .fx{animation-duration:2.2s}
  .seal{transition:none}
}
</style>
</head>
<body data-phase="title">
<div id="app">
  <header id="hud">
    <div class="brand"><img class="pix" id="brand-ico" alt="">도트 닥터</div>
    <div class="chip stat" id="hud-day">1일차 · 월요일</div>
    <div class="chip stat" id="hud-clock"><img class="pix" data-ico="clock" alt=""><span id="hud-time">09:00</span></div>
    <div class="chip stat"><img class="pix" data-ico="coin" alt=""><span id="hud-money">₩0</span></div>
    <div class="chip stat" id="hud-rep"></div>
    <button class="btn btn-sm" id="btn-book" type="button">진료 수첩</button>
    <button class="btn btn-sm" id="btn-sound" type="button" aria-pressed="true">소리 켬</button>
  </header>
  <main id="main">
    <div id="stage-wrap">
      <div id="stage">
        <canvas id="scene" width="320" height="180" aria-label="도트 의원 진료실 화면"></canvas>
        <div id="overlay">
          <div id="title-ui"><div class="logo">도트 닥터</div><div class="logo-sub">DOT DOCTOR · 동네 의원 진료 게임</div></div>
          <div class="bubble doc" id="bub-doc" hidden></div>
          <div class="bubble" id="bub-pt" hidden></div>
          <div id="banner" hidden></div>
          <div id="slip" hidden></div>
          <div id="cap" hidden><span id="cap-text"></span><button class="btn btn-go" id="cap-ok" type="button">확인</button></div>
          <div id="fxlayer"></div>
        </div>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
  <div id="modal" hidden><div class="mcard" id="modal-card" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'ko';

/* ================= 기본 상수 · 유틸 ================= */
const W = 320, H = 180, OPEN = 540, CLOSE = 1080;
const LANE = 134, SIT_Y = 117, STOOL_X = 140, EXIT_X = 334, SEATS = 5;
const SEAT_X = i => 240 + i * 15;
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const WEEK = 5;

const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const won = n => '₩' + Math.round(n).toLocaleString('ko-KR');
const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const signed = n => (n > 0 ? '+' : '') + n;
function lastJong(word) {
  for (let i = word.length - 1; i >= 0; i--) {
    const c = word.charCodeAt(i);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28;
  }
  return 0;
}
const withRo = w => { const j = lastJong(w); return w + (j === 0 || j === 8 ? '로' : '으로'); };
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function shade(a, f) { return f < 1 ? mix(a, '#000000', 1 - f) : mix(a, '#ffffff', f - 1); }
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function makeSprite(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) { const col = pal[row[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
  });
  return c;
}

function buildPerson(look, pose) {
  const rows = (pose === 'sit' ? BODY.slice(0, 19).concat(SIT) : BODY).map(r => r.split(''));
  const put = (tpl, y0) => tpl.forEach((r, dy) => {
    const row = rows[y0 + dy]; if (!row) return;
    for (let x = 0; x < r.length; x++) if (r[x] !== '.') row[x] = r[x];
  });
  const set = (x, y, ch, only) => { const row = rows[y]; if (row && row[x] !== undefined && (!only || only.includes(row[x]))) row[x] = ch; };
  put(HAIR[look.hair] || HAIR.short, 0);
  if (look.coat) put(COAT, 12);
  if (look.mirror) put(MIRROR, 2);
  if (look.cap) put(CAP, 0);
  if (look.stripe) put(['.kGGGGGGGGGGk.'], 15);
  if (look.glasses) put(GLASSES, 6);
  if (look.beard) put(BEARD, 9);
  const pal = {
    k: C.out, e: C.out, s: look.skin, b: mix(look.skin, '#ff7b7b', 0.35), m: mix(look.skin, '#a8323a', 0.6),
    h: look.hairC, t: look.shirt, T: shade(look.shirt, 0.78), p: look.pants, o: '#3b2b30',
    w: '#ffffff', i: '#9fd3f2', g: '#55627a', G: '#c9d3dc', M: '#e9f1f7', r: '#e04a4a', R: '#d23a3a',
    n: '#ee7a70', d: '#8fd8ff', O: '#ec8f74', B: '#e7c49a',
  };
  if (look.coat) pal.T = '#cdd5df';
  const wrist = [[1, 17], [2, 17], [1, 18], [2, 18]];
  const ankle = pose === 'sit' ? [[4, 20], [5, 20], [4, 21]] : [[4, 21], [5, 21], [4, 20], [5, 20]];
  for (const m of look.mods || []) {
    if (m === 'nose') { set(6, 8, 'n'); set(7, 8, 'n'); }
    if (m === 'redeye') { set(4, 8, 'r'); set(9, 8, 'r'); set(3, 7, 'r', 's'); set(10, 7, 'r', 's'); }
    if (m === 'flush') pal.b = '#ff5050';
    if (m === 'pale') { pal.s = mix(look.skin, '#ffffff', 0.38); pal.b = pal.s; pal.m = '#b98a8a'; }
    if (m === 'sweat') { set(12, 3, 'd'); set(12, 4, 'd'); set(13, 4, 'd'); }
    if (m === 'wound' && look.treated !== 'suture') { set(2, 17, 'R'); set(2, 18, 'R'); set(1, 18, 'R'); }
    if (m === 'limb' && !look.treated) for (const [x, y] of (look.loc === 'wrist' ? wrist : ankle)) set(x, y, 'O');
    if (m === 'blue') pal.m = '#6a5fb5';
    if (m === 'hives') for (const [x, y] of [[4, 4], [9, 5], [3, 9], [8, 10], [5, 3], [10, 9], [2, 18], [11, 18]]) set(x, y, 'R', 's');

  if (look.treated === 'cast' || look.treated === 'bandage') {

    for (const [x, y] of (look.loc === 'wrist' ? [[1, 16], [2, 16], ...wrist] : ankle)) set(x, y, ch);

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const MEL = [76, 79, 84, 79, 76, 79, 84, 0, 72, 76, 81, 76, 72, 76, 81, 0, 77, 81, 84, 81, 79, 77, 76, 74, 74, 0, 79, 0, 83, 0, 86, 0,
  76, 76, 79, 76, 84, 0, 79, 0, 81, 79, 76, 72, 74, 76, 0, 0, 77, 76, 74, 72, 74, 77, 81, 0, 79, 0, 74, 0, 71, 0, 72, 0];
const BASS = [48, 48, 43, 48, 45, 45, 40, 45, 41, 41, 48, 41, 43, 43, 50, 43, 48, 48, 43, 48, 45, 45, 40, 45, 41, 41, 48, 41, 43, 43, 50, 43];
const SND = {
  ac: null, master: null, on: true, timer: null, nextT: 0, step: 0,
  init() {
    if (this.ac) return true;
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return false;
    try { this.ac = new A(); this.master = this.ac.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ac.destination); } catch (e) { this.ac = null; return false; }
    return true;
  },
  wake() { if (this.init() && this.ac.state === 'suspended') this.ac.resume().catch(() => {}); },
  note(f, t, d, type = 'square', v = 0.06, slide = 0) {
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  sfx(name) {
    if (!this.on || !this.init()) return;
    this.wake();
    const t = this.ac.currentTime + 0.01, n = (f, dt, d, ty, v, sl) => this.note(f, t + dt, d, ty, v, sl);
    switch (name) {
      case 'click': n(660, 0, 0.04, 'square', 0.03); break;
      case 'tool': n(523, 0, 0.06, 'square', 0.04); n(784, 0.06, 0.08, 'square', 0.04); break;
      case 'door': n(784, 0, 0.18, 'triangle', 0.08); n(659, 0.18, 0.28, 'triangle', 0.08); break;
      case 'good': [72, 76, 79, 84].forEach((m, i) => n(midi(m), i * 0.07, 0.12, 'square', 0.05)); break;
      case 'bad': n(330, 0, 0.35, 'sawtooth', 0.05, 0.45); break;
      case 'coin': n(988, 0, 0.07, 'square', 0.05); n(1319, 0.07, 0.22, 'square', 0.05); break;
      case 'stitch': n(1200, 0, 0.04, 'square', 0.04); break;
      case 'miss': n(150, 0, 0.12, 'square', 0.06, 0.7); break;
      case 'wrap': n(392, 0, 0.05, 'triangle', 0.08); n(523, 0.05, 0.08, 'triangle', 0.08); break;
      case 'stamp': n(110, 0, 0.12, 'square', 0.09, 0.5); break;
      case 'shutter': n(2000, 0, 0.03, 'square', 0.04); n(1200, 0.05, 0.05, 'square', 0.04); break;
      case 'siren': for (let i = 0; i < 4; i++) { n(880, i * 0.36, 0.18, 'triangle', 0.05); n(660, i * 0.36 + 0.18, 0.18, 'triangle', 0.05); } break;
    }
  },
  startBgm() {
    if (!this.on || this.timer || !this.init()) return;
    this.wake();
    this.nextT = this.ac.currentTime + 0.15; this.step = 0;
    this.timer = setInterval(() => this.sched(), 90);
  },
  stopBgm() { clearInterval(this.timer); this.timer = null; },
  sched() {
    const E = 0.21;
    while (this.nextT < this.ac.currentTime + 0.35) {
      const i = this.step % 64, m = MEL[i];
      if (m) this.note(midi(m), this.nextT, E * 0.85, 'square', 0.018);
      if (i % 2 === 0) { const b = BASS[(i / 2) % 32]; this.note(midi(b), this.nextT, E * 1.7, 'triangle', 0.045); }
      this.nextT += E; this.step++;
    }
  },
};

function makeName() {
  const a = pick(GIV); let b = pick(GIV); while (b === a) b = pick(GIV);
  return pick(SUR) + a + b;

function makePatient(dz) {
  const [a0, a1] = dz.age || [17, 76];
  const age = ri(a0, a1), old = age >= 62, kid = age <= 13;
  const loc = dz.loc ? pick(['wrist', 'ankle']) : null;
  const look = {
    skin: pick(SKIN), hair: old ? pick(['bald', 'short', 'bob']) : pick(['short', 'long', 'bun', 'spiky', 'bob']),
    hairC: old ? pick(GRAYH) : pick(HAIRC), shirt: pick(SHIRT), pants: pick(PANTS),
    glasses: !kid && Math.random() < (old ? 0.5 : 0.2), beard: old && Math.random() < 0.3,
    mods: dz.look || [], loc, treated: null,
  };
  const locName = loc === 'wrist' ? '손목' : '발목';
  const sub = s => String(s).replace(/\{loc\}/g, locName);
  const p = {
    id: ++pid, name: makeName(), age, dz, loc, locName, look,
    cc: sub(pick(dz.cc)), hx: dz.hx.map(sub), patience: 100, waited: 0, found: {}, order: [],
    x: EXIT_X, y: LANE, pose: 'walk', path: null, speed: 70, seat: -1,
  };
  p.res = rollFindings(p, sub);

}
function rebuildSprites(p) { p.spr = { stand: buildPerson(p.look, 'stand'), sit: buildPerson(p.look, 'sit') }; }
function rollFindings(p, sub) {
  const d = p.dz, r = {};
  const t = d.temp ? rnd(d.temp[0], d.temp[1]) : rnd(36.3, 36.9);
  r.temp = { text: t.toFixed(1) + '℃', flag: t >= 37.5 ? 'H' : '' };
  if (d.bp) r.bp = { text: `${ri(d.bp[0][0], d.bp[0][1])}/${ri(d.bp[1][0], d.bp[1][1])} mmHg`, flag: 'H' };
  else r.bp = { text: `${ri(108, 128)}/${ri(68, 82)} mmHg`, flag: '' };

    : { text: `백혈구 ${(ri(55, 95) * 100).toLocaleString('ko-KR')} · Hb ${rnd(12.8, 15.2).toFixed(1)} · 혈당 ${ri(84, 104)} (정상)`, flag: '' };
  return r;

/* ================= 하루 흐름 ================= */
function planDay() {
  const top = Math.min(S.day, MAX_DZ_DAY);
  const n = Math.min(12, 4 + S.day) + (S.rep >= 75 ? 1 : 0);
  const pool = DZ.filter(d => d.day <= top);
  const list = DZ.filter(d => d.day === S.day);
  let fakers = list.filter(d => d.id === 'faker').length;
  const weight = d => (d.day >= top - 1 && S.day <= MAX_DZ_DAY ? 1.6 : 1);
  const total = pool.reduce((a, d) => a + weight(d), 0);
  let guard = 0;
  while (list.length < n && guard++ < 500) {
    let r = Math.random() * total, d = pool[0];
    for (const q of pool) { r -= weight(q); if (r <= 0) { d = q; break; } }
    if (d.id === 'faker') { if (fakers >= 1) continue; fakers++; }
    list.push(d);
  }
  shuffle(list);
  const times = [OPEN, OPEN + ri(6, 25)];
  for (let i = 2; i < list.length; i++) times.push(ri(570, 960));
  times.sort((a, b) => a - b);
  S.schedule = list.map((dz, i) => ({ dz, at: times[i] }));
}

function startDay() {
  Object.assign(S, { phase: 'clinic', time: OPEN, queue: [], people: [], current: null, ui: 'idle', busy: false, sel: null, anim: null, closeup: null, mg: null });
  S.seats = new Array(SEATS).fill(null);
  S.ds = freshDayStats();
  hideBubbles();
  planDay();
  S.stagger = 0;
  processArrivals();
  setPhase('clinic');
  updateHUD(); renderPanel();
}

function processArrivals() {
  while (S.schedule.length && S.schedule[0].at <= S.time && S.time < CLOSE) arrive(S.schedule.shift());
}
function arrive(entry) {
  const i = S.seats.findIndex(s => !s);
  if (i < 0) {
    S.rep = clamp(S.rep - 2, 0, 100); S.ds.left++; S.ds.rep -= 2;
    fx('대기실이 꽉 차서 돌아갔어요', 276, 110, 'bad');
    return;
  }
  const p = makePatient(entry.dz);
  p.seat = i; S.seats[i] = p; S.queue.push(p); S.people.push(p);
  p.x = EXIT_X + S.stagger * 20; S.stagger++;
  moveTo(p, [{ x: SEAT_X(i), y: LANE }, { x: SEAT_X(i), y: SIT_Y, pose: 'sit' }]);
  SND.sfx('door');
}

function advance(mins) {
  S.stagger = 0;
  const rate = S.up.sofa ? 0.36 : 0.55;
  for (let i = 0; i < mins; i++) {
    S.time++;
    processArrivals();
    for (const p of S.queue) { p.patience -= rate; p.waited++; }
    for (const p of S.queue.filter(q => q.patience <= 0)) leaveAngry(p);
  }
  updateHUD();
}

function freeSeat(p) { if (p.seat >= 0) { S.seats[p.seat] = null; p.seat = -1; } }
function leave(p, mood) {
  p.leaving = true;
  p.emote = mood ? { kind: mood, until: performance.now() + 2200 } : null;
  freeSeat(p);
  moveTo(p, [{ x: p.x, y: LANE }, { x: EXIT_X + 12, y: LANE }], () => { S.people = S.people.filter(q => q !== p); });
}
function leaveAngry(p) {
  S.queue = S.queue.filter(q => q !== p);
  S.rep = clamp(S.rep - 5, 0, 100); S.ds.left++; S.ds.rep -= 5;
  fx('기다리다 지쳐 돌아갔어요', p.x + 7, p.y - 4, 'bad');
  leave(p, 'anger');
}
function closingCheck() {
  if (S.time < CLOSE || S.current) return;
  S.schedule = [];

function startMinigame(kind, p, done) {

    const pts = [];

      const t = (i + 0.5) / 5, cx = ax + (bx - ax) * t, cy = ay + (by - ay) * t;
      pts.push({ x: cx + nx * 12, y: cy + ny * 12 }, { x: cx - nx * 12, y: cy - ny * 12 });
    }
    S.mg = { ...base, limit: 16000, pts, idx: 0, miss: 0, w: { ax, ay, bx, by } };
    banner('반짝이는 점을 차례로 눌러 상처를 꿰매세요');
  } else if (kind === 'cast' || kind === 'bandage') {
    const zw = kind === 'cast' ? 0.16 : 0.2;
    S.mg = { ...base, limit: 16000, need: kind === 'cast' ? 4 : 3, hits: 0, miss: 0, cur: 0, dir: 1, speed: kind === 'cast' ? 0.85 : 0.75, zw, zone: newZone(zw), shake: 0 };
    banner('막대가 초록 칸에 오면 누르세요 · 클릭 또는 스페이스');
  } else {
    S.mg = { ...base, limit: 18000, stage: 'aim', nx: 0, dir: 1, speed: 0.75, target: rnd(0.3, 0.7), aim: 0, fill: 0, holding: false, tries: 0, hitX: 0 };
    banner('바늘이 금색 표시 위에 오면 누르세요');
  }
  $('#stage').classList.add('mg');
}
function newZone(w) { return { a: rnd(0.06, 0.94 - w), w }; }
function mgEnd(score) {
  const m = S.mg; if (!m || m.over) return;
  m.over = true; m.final = clamp(score, 0, 1);
  banner(`${scoreWord(m.final)}!`);
  setTimeout(() => {
    S.mg = null; hideBanner(); $('#stage').classList.remove('mg');
    m.done(m.final);
  }, 700);
}
function mgPress(x, y) {
  const m = S.mg; if (!m || m.over) return;
  if (m.kind === 'suture') {
    if (x === undefined) return;
    const t = m.pts[m.idx];
    if (Math.hypot(x - t.x, y - t.y) <= 12) {
      m.idx++; SND.sfx('stitch');
      if (m.idx === m.pts.length) mgEnd(1 - Math.min(0.6, m.miss * 0.12));
    } else if (x > BOX.x && x < BOX.x + BOX.w && y > BOX.y && y < BOX.y + BOX.h) {
      m.miss++; SND.sfx('miss'); fx('아야!', x, y, 'bad');
    }
  } else if (m.kind === 'cast' || m.kind === 'bandage') {
    if (m.cur >= m.zone.a && m.cur <= m.zone.a + m.zone.w) {
      m.hits++; SND.sfx('wrap');
      m.zone = newZone(m.zw); m.speed *= 1.16;
      if (m.hits >= m.need) mgEnd(1 - Math.min(0.5, m.miss * 0.12));
    } else {
      m.miss++; m.shake = 0.3; SND.sfx('miss');
      if (m.miss >= 4) mgEnd((m.hits / m.need) * 0.6);
    }
  } else if (m.stage === 'aim') {
    const aim = clamp(1 - Math.abs(m.nx - m.target) / 0.16, 0, 1);
    if (aim < 0.2 && m.tries < 1) {
      m.tries++; SND.sfx('miss'); fx('빗나갔어요! 한 번 더', 160, 66, 'bad');
    } else {
      m.aim = aim; m.hitX = m.nx; m.stage = 'push'; SND.sfx('stitch');
      banner(m.kind === 'iv' ? '꾹 눌러 수액을 연결하고, 초록 칸에서 떼세요' : '꾹 눌러 약을 넣고, 초록 칸에서 떼세요');
    }
  } else if (m.stage === 'push') {
    m.holding = true;
  }
}
function mgRelease() {
  const m = S.mg; if (!m || m.over || m.stage !== 'push' || !m.holding) return;
  m.holding = false;
  const f = m.fill;
  const push = f >= 0.7 && f <= 0.9 ? 1 : clamp(1 - (Math.abs(f - 0.8) - 0.1) * 4, 0, 1);
  mgEnd(0.5 * m.aim + 0.5 * push);
}
function mgUpdate(dt, now) {
  const m = S.mg; if (!m || m.over) return;
  if (m.shake > 0) m.shake -= dt;
  if (m.kind === 'cast' || m.kind === 'bandage') {
    m.cur += m.dir * m.speed * dt;
    if (m.cur > 1) { m.cur = 1; m.dir = -1; } else if (m.cur < 0) { m.cur = 0; m.dir = 1; }
  } else if (m.kind === 'inject' || m.kind === 'iv') {
    if (m.stage === 'aim') {
      m.nx += m.dir * m.speed * dt;
      if (m.nx > 1) { m.nx = 1; m.dir = -1; } else if (m.nx < 0) { m.nx = 0; m.dir = 1; }
    } else if (m.holding) {
      m.fill += dt * 0.5;
      if (m.fill >= 1) { m.fill = 1; m.holding = false; mgEnd(0.5 * m.aim + 0.05); return; }
    }
  }
  if (now - m.t0 > m.limit) {
    if (m.kind === 'suture') mgEnd((m.idx / m.pts.length) * (1 - Math.min(0.6, m.miss * 0.12)));
    else if (m.kind === 'cast' || m.kind === 'bandage') mgEnd((m.hits / m.need) * (1 - Math.min(0.5, m.miss * 0.12)));

  const sx = Math.round(80 + (m.stage === 'aim' ? m.nx : m.hitX) * 160);
  const tipY = m.stage === 'aim' ? ay - 6 : veinY(sx) + 1;
  const top = tipY - 46, f = m.fill;

  R(sx - 5, top, 11, 32, C.out); R(sx - 4, top + 1, 9, 30, '#eef4fa');
  R(sx - 4, top + 1 + Math.round(f * 26), 9, 30 - Math.round(f * 26), m.kind === 'iv' ? '#bfe8ff' : '#ffe08a');
  for (let i = 0; i < 5; i++) R(sx + 2, top + 5 + i * 5, 2, 1, C.gray);

}

  else if (ds.wrong >= 2) remark = '오진이 잦았어요. 진단 전에 진료 수첩의 핵심 소견을 확인해 보세요.';
  const over = S.rep <= 0;

  modal(`<span class="eyebrow">DAY ${S.day} 마감</span><h2>${S.day}일차 진료 일지</h2>

      <div class="stat-cell"><small>진료한 환자</small><b>${ds.seen}명</b></div>
      <div class="stat-cell"><small>정확한 진단</small><b>${ds.correct}명 (${acc}%)</b></div>
      <div class="stat-cell"><small>오진</small><b>${ds.wrong}명</b></div>
      <div class="stat-cell"><small>돌아간 환자</small><b>${ds.left}명</b></div>
      <div class="stat-cell"><small>오늘 수입</small><b>${won(ds.earned)}</b></div>
      <div class="stat-cell"><small>평판 변화</small><b class="${ds.rep >= 0 ? 'plus' : 'minus'}">${signed(ds.rep)}</b></div>
    </div>
    <p class="remark">${over ? '평판이 바닥나 더 이상 환자가 찾아오지 않아요...' : remark}</p>
    <div class="actions">${over ? '<button class="btn btn-warn" data-m="over" type="button">결과 보기</button>'
      : weekEnd ? '<button class="btn btn-go" data-m="final" type="button">주간 결산 보기</button>'
      : '<button class="btn btn-go" data-m="shop" type="button">장비 상점으로</button>'}</div>`,
  { shop: () => showShop(), final: () => showFinal(false), over: () => showFinal(true) });
  renderPanel();
}

function showShop() {
  setPhase('shop');
  const items = SHOP.map(it => {
    const own = !!S.up[it.id], lockDay = it.day && S.day + 1 < it.day;
    const btn = own ? '<span class="badge">보유 중</span>'
      : lockDay ? `<span class="meta">${it.day}일차부터 쓸모 있어요</span>`
      : `<button class="btn ${S.money >= it.price ? 'btn-go' : ''}" data-m="buy" data-id="${it.id}" type="button" ${S.money >= it.price ? '' : 'disabled'}>구매 · ${won(it.price)}</button>`;
    return `<div class="item${own ? ' owned' : ''}"><b>${it.name}</b><p>${it.desc}</p>${btn}</div>`;
  }).join('');
  modal(`<span class="eyebrow">SHOP</span><h2>도트 의원 장비 상점</h2>
    <p>보유 금액 <b>${won(S.money)}</b></p><div class="shop">${items}</div>
    <div class="actions"><button class="btn btn-go" data-m="next" type="button">${S.day + 1}일차 진료 준비</button></div>`,
  {
    buy: b => {
      const it = SHOP.find(x => x.id === b.dataset.id);
      if (!it || S.up[it.id] || S.money < it.price) return;
      S.money -= it.price; S.up[it.id] = true; SND.sfx('coin'); updateHUD(); showShop();
    },
    next: () => { S.day++; showDayIntro(); },
  }, true);
}

function showFinal(gameOver) {
  setPhase('final');
  const w = S.week, acc = w.seen ? w.correct / w.seen : 0;
  let g = 'D', t = '폐업 위기의 의원';
  if (!gameOver) {
    if (S.rep >= 85 && acc >= 0.85) { g = 'S'; t = '동네의 전설, 명의'; }
    else if (S.rep >= 70) { g = 'A'; t = '믿음직한 동네 주치의'; }
    else if (S.rep >= 50) { g = 'B'; t = '성실한 새내기 원장'; }
    else if (S.rep >= 30) { g = 'C'; t = '아직은 수련 중'; }
  }
  modal(`<span class="eyebrow">${gameOver ? 'GAME OVER' : 'WEEK RESULT'}</span><h2>${gameOver ? '도트 의원이 문을 닫았어요' : '일주일 진료 결산'}</h2>
    <div class="grade"><span class="big">${g}</span><div><b>${t}</b><p class="meta">평판 ${Math.round(S.rep)}점 · 진단 정확도 ${Math.round(acc * 100)}%</p></div></div>
    <div class="statgrid">
      <div class="stat-cell"><small>진료한 환자</small><b>${w.seen}명</b></div>
      <div class="stat-cell"><small>정확한 진단</small><b>${w.correct}명</b></div>
      <div class="stat-cell"><small>오진</small><b>${w.wrong}명</b></div>
      <div class="stat-cell"><small>돌아간 환자</small><b>${w.left}명</b></div>
      <div class="stat-cell"><small>총수입</small><b>${won(w.earned)}</b></div>
      <div class="stat-cell"><small>보유 금액</small><b>${won(S.money)}</b></div>
    </div>
    <div class="actions">${gameOver ? '' : '<button class="btn" data-m="endless" type="button">무한 진료 계속하기</button>'}<button class="btn btn-go" data-m="restart" type="button">처음부터 다시</button></div>`,
  {
    endless: () => { S.endless = true; showShop(); },
    restart: () => { clearSave(); closeModal(); SND.stopBgm(); resetGame(); showTitle(); },
  });
}

function openBook() {
  const prev = modalEl.hidden ? null : { html: mcard.innerHTML, acts: S.macts, wide: mcard.classList.contains('wide') };
  const unlockedDay = Math.min(S.day, MAX_DZ_DAY);
  const tools = TOOLS.map(t => `<li class="${t.day > S.day ? 'off' : ''}">${iconImg(t.icon)}<div><b>${t.name}</b> · ${t.day > S.day ? `${t.day}일차 해금` : toolCost(t) + '분'}<br>${t.desc}</div></li>`).join('');
  const cards = DZ.map(d => d.day <= unlockedDay
    ? `<article class="dzcard"><header><b>${d.name}</b><span class="badge">${TX[d.tx].label}</span></header><p>${d.hint}</p><footer>${S.seen[d.id] ? `진료 ${S.seen[d.id]}회` : '아직 만나지 못했어요'}</footer></article>`
    : `<article class="dzcard locked"><header><b>???</b><span class="badge">${d.day}일차</span></header><p>아직 만날 수 없는 질환이에요.</p></article>`).join('');
  modal(`<span class="eyebrow">HANDBOOK</span><h2>진료 수첩</h2>
    <p class="meta">헷갈릴 때 펼쳐 보세요. 수첩을 보는 동안에는 시간이 흐르지 않아요.</p>
    <h3>검사 도구</h3><ul class="toolref">${tools}</ul>
    <h3>질환과 핵심 소견</h3><div class="book-grid">${cards}</div>
    <div class="actions"><button class="btn btn-go" data-m="close" type="button">닫기</button></div>`,
  { close: () => { if (prev) modal(prev.html, prev.acts, prev.wide); else closeModal(); } }, true);
}

/* ================= 게임 시작 · 리셋 ================= */
function resetGame() {
  Object.assign(S, { day: 1, money: 0, rep: 50, up: {}, seen: {}, endless: false, chartNo: 0,
    week: { seen: 0, correct: 0, wrong: 0, left: 0, earned: 0 }, time: OPEN, queue: [], schedule: [], people: [], current: null,
    ui: 'idle', busy: false, sel: null, anim: null, closeup: null, mg: null });
  hideBubbles(); hideBanner(); $('#slip').hidden = true; $('#cap').hidden = true;
}
function showTitle() { setPhase('title'); updateHUD(); renderPanel(); }

/* ================= 입력 ================= */
function toScene(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  SND.wake();
  if (S.mg) { e.preventDefault(); const pt = toScene(e); mgPress(pt.x, pt.y); }
});
window.addEventListener('pointerup', () => { if (S.mg) mgRelease(); });
window.addEventListener('pointercancel', () => { if (S.mg) mgRelease(); });
window.addEventListener('keydown', e => {
  if (!modalEl.hidden) { if (e.key === 'Escape' && S.macts.close) S.macts.close(); return; }
  if (S.mg && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) mgPress(); return; }
  if (S.closeup && (e.key === 'Escape')) { closeCloseup(); return; }
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.phase === 'clinic' && S.ui === 'exam' && !S.busy && /^[1-8]$/.test(e.key)) { const t = TOOLS[+e.key - 1]; if (t) useTool(t.id); }
});
window.addEventListener('keyup', e => { if (S.mg && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); mgRelease(); } });

$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  SND.wake();
  const a = b.dataset.act;
  if (a !== 'tool') SND.sfx('click');
  switch (a) {
    case 'new': resetGame(); clearSave(); showDayIntro(); break;
    case 'cont': { const s = readSave(); if (s) { resetGame(); loadSave(s); showDayIntro(); } break; }
    case 'book': openBook(); break;
    case 'call': callNext(); break;
    case 'wait': waitNext(); break;
    case 'endday': endDay(); break;
    case 'tool': useTool(b.dataset.id); break;
    case 'dx': if (!S.busy) { S.ui = 'dx'; S.sel = null; renderPanel(); } break;
    case 'back': S.ui = 'exam'; renderPanel(); break;
    case 'pick': pickDx(b.dataset.id); break;
    case 'confirm': confirmDx(); break;
    case 'next': afterResult(); break;
  }
});
modalEl.addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b || b.disabled) return;
  SND.wake();
  const fn = S.macts[b.dataset.m];
  if (fn) { if (b.dataset.m !== 'buy') SND.sfx('click'); fn(b); }
});
$('#cap-ok').addEventListener('click', () => { SND.sfx('click'); closeCloseup(); });
$('#btn-book').addEventListener('click', () => { SND.wake(); SND.sfx('click'); if (modalEl.hidden || !S.macts.close) openBook(); });
function setSound(on) {
  SND.on = on;
  const b = $('#btn-sound'); b.textContent = on ? '소리 켬' : '소리 끔'; b.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('dotdoctor.sound', on ? '1' : '0'); } catch (e) { /* 무시 */ }
  if (!on) SND.stopBgm(); else if (S.phase !== 'title') SND.startBgm();
}
$('#btn-sound').addEventListener('click', () => setSound(!SND.on));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) SND.stopBgm(); else if (SND.on && S.phase !== 'title' && SND.ac) SND.startBgm();
});

/* ================= 화면 맞춤 ================= */
const stage = $('#stage'), wrap = $('#stage-wrap');
function fit() {
  const cw = wrap.clientWidth - 36;
  const wide = window.matchMedia('(min-width: 1000px)').matches;
  const maxH = wide ? window.innerHeight - $('#hud').offsetHeight - 70 : window.innerHeight * 0.62;
  const raw = Math.max(0.5, Math.min(cw / W, maxH / H));
  const dpr = window.devicePixelRatio || 1;
  const s = raw < 2 ? raw : Math.floor(raw * dpr) / dpr;
  stage.style.width = (W * s) + 'px';
  stage.style.height = (H * s) + 'px';
  stage.style.setProperty('--s', s.toFixed(3));
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);

/* ================= 루프 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updatePeople(dt);
  mgUpdate(dt, now);
  draw(now);
  if (!bubPt.hidden && S.current) placeAt(bubPt, S.current.x + 7, S.current.y + 1);
  if (!bubDoc.hidden) placeAt(bubDoc, 87, 100);
  requestAnimationFrame(loop);
}

function boot(data) {
  buildIcons();
  $('#brand-ico').src = ICON_URL.cross;
  for (const img of document.querySelectorAll('[data-ico]')) img.src = ICON_URL[img.dataset.ico];
  S.docSpr = buildPerson({ skin: '#f2cfae', hair: 'short', hairC: '#2e2230', shirt: '#ffffff', pants: '#3d4a5c', coat: true, mirror: true }, 'stand');
  S.nurseSpr = buildPerson({ skin: '#efc29b', hair: 'bob', hairC: '#4a3226', shirt: '#f29bb8', pants: '#e07fa0', cap: true }, 'stand');
  S.titleWalker = buildPerson({ skin: '#d9a074', hair: 'bun', hairC: '#4a3226', shirt: '#4f8fd6', pants: '#3a4a6b', mods: ['nose'] }, 'stand');
  let snd = true;
  try { snd = localStorage.getItem('dotdoctor.sound') !== '0'; } catch (e) { /* 무시 */ }
  setSound(snd);
  fit();
  if (data && data.save) { loadSave(data.save); showDayIntro(); } else showTitle();
  requestAnimationFrame(loop);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: S.phase === 'title' ? null : makeSave() }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
